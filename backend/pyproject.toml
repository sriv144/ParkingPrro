[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parkingpro-api"
version = "2.0.0"
description = "ParkingPro modular Flask API"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<3.2",
  "Flask-Cors>=6,<7",
  "Flask-JWT-Extended>=4.7,<5",
  "Flask-Limiter[redis]>=4,<5",
  "Flask-Migrate>=4.1,<5",
  "Flask-Smorest>=0.47,<0.48",
  "Flask-SQLAlchemy>=3.1,<4",
  "GeoAlchemy2>=0.18,<0.19",
  "gunicorn>=23,<24",
  "httpx>=0.28,<0.29",
  "marshmallow>=4.1,<5",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "qstash>=3,<4",
  "razorpay>=1.4,<2",
  "redis>=6,<7",
  "sentry-sdk[flask]>=2,<3",
  "setuptools>=80,<81",
  "SQLAlchemy>=2.0,<2.1",
  "Werkzeug>=3.1,<4"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.12,<0.14",
  "types-redis>=4.6,<5"
]

[tool.setuptools.packages.find]
include = ["parkingpro*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "parkingpro.api.*"
disallow_untyped_decorators = false
disallow_untyped_defs = false
disable_error_code = ["no-untyped-def", "unused-ignore"]

[tool.coverage.run]
branch = true
source = ["parkingpro"]
