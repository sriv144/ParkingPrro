name: ParkingPro CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: parkingpro-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,python
      - uses: github/codeql-action/analyze@v4

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: parkingpro_test
          POSTGRES_USER: parkingpro
          POSTGRES_PASSWORD: parkingpro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parkingpro -d parkingpro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://parkingpro:parkingpro@localhost:5432/parkingpro_test
      PARKINGPRO_TEST_DATABASE_URL: postgresql+psycopg://parkingpro:parkingpro@localhost:5432/parkingpro_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install API dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Install workspace dependencies
        run: npm ci
      - name: Apply test migrations
        working-directory: backend
        run: |
          python -m flask --app parkingpro.wsgi db upgrade
          python -m flask --app parkingpro.wsgi db check
      - name: Python quality and tests
        working-directory: backend
        run: |
          ruff check parkingpro tests migrations
          mypy --config-file pyproject.toml parkingpro
          pytest --cov=parkingpro --cov-report=term-missing --cov-fail-under=55
      - name: Frontend quality
        run: |
          npm run audit:known
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Operator browser E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e --workspace @parkingpro/operator-web
      - name: Verify generated OpenAPI contract
        shell: bash
        run: |
          cd backend
          python -m flask --app parkingpro.wsgi openapi write ../packages/api-contracts/openapi.json
          cd ..
          npm run generate --workspace @parkingpro/api-contracts
          git diff --exit-code -- packages/api-contracts/openapi.json packages/api-contracts/src/schema.d.ts

  containers:
    runs-on: ubuntu-latest
    needs: [verify, security]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t parkingpro-api:${{ github.sha }} .
      - name: Build operator image
        run: docker build -f infrastructure/docker/Dockerfile.operator --build-arg VITE_API_URL=https://example.invalid -t parkingpro-operator:${{ github.sha }} .
      - name: Verify non-root images
        run: |
          test "$(docker inspect -f '{{.Config.User}}' parkingpro-api:${{ github.sha }})" = "parkingpro"
          test -n "$(docker inspect -f '{{.Config.User}}' parkingpro-operator:${{ github.sha }})"
      - name: Start isolated runtime dependencies
        run: |
          docker network create parkingpro-ci
          docker run -d --name parkingpro-ci-postgres --network parkingpro-ci --network-alias postgres \
            -e POSTGRES_DB=parkingpro -e POSTGRES_USER=parkingpro -e POSTGRES_PASSWORD=parkingpro \
            --health-cmd="pg_isready -U parkingpro -d parkingpro" --health-interval=2s \
            --health-timeout=3s --health-retries=30 postgis/postgis:17-3.5
          docker run -d --name parkingpro-ci-redis --network parkingpro-ci --network-alias redis \
            --health-cmd="redis-cli ping" --health-interval=2s --health-timeout=3s \
            --health-retries=30 redis:7.4-alpine
          for service in parkingpro-ci-postgres parkingpro-ci-redis; do
            for attempt in $(seq 1 30); do
              test "$(docker inspect -f '{{.State.Health.Status}}' "$service")" = "healthy" && break
              sleep 2
            done
            test "$(docker inspect -f '{{.State.Health.Status}}' "$service")" = "healthy"
          done
      - name: Apply migrations from the production API image
        run: |
          docker run --rm --network parkingpro-ci \
            -e APP_ENV=development \
            -e DATABASE_URL=postgresql+psycopg://parkingpro:parkingpro@postgres:5432/parkingpro \
            -e REDIS_URL=redis://redis:6379/0 \
            -e SECRET_KEY=ci-session-secret -e JWT_SECRET_KEY=ci-jwt-secret \
            -e QR_SIGNING_KEY=ci-qr-secret -e CORS_ORIGINS=http://localhost:8080 \
            -e TRUSTED_HOSTS=localhost,127.0.0.1,parkingpro-api \
            parkingpro-api:${{ github.sha }} flask --app parkingpro.wsgi db upgrade
      - name: Verify production container health
        run: |
          docker run -d --name parkingpro-ci-api --network parkingpro-ci -p 5000:10000 \
            -e PORT=10000 \
            -e APP_ENV=development \
            -e DATABASE_URL=postgresql+psycopg://parkingpro:parkingpro@postgres:5432/parkingpro \
            -e REDIS_URL=redis://redis:6379/0 \
            -e SECRET_KEY=ci-session-secret -e JWT_SECRET_KEY=ci-jwt-secret \
            -e QR_SIGNING_KEY=ci-qr-secret -e CORS_ORIGINS=http://localhost:8080 \
            -e TRUSTED_HOSTS=localhost,127.0.0.1,parkingpro-api \
            parkingpro-api:${{ github.sha }}
          docker run -d --name parkingpro-ci-operator -p 8080:8080 \
            parkingpro-operator:${{ github.sha }}
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:5000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:5000/openapi.json > /dev/null
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/app/overview | grep -q '<div id="root"></div>'
          test "$(docker inspect -f '{{.RestartCount}}' parkingpro-ci-api)" = "0"
          test "$(docker inspect -f '{{.RestartCount}}' parkingpro-ci-operator)" = "0"
      - name: Enforce fixable high and critical image findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: parkingpro-api:${{ github.sha }}
          version: v0.74.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Create Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: parkingpro-api:${{ github.sha }}
          version: v0.74.0
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-api.sarif
      - name: Clean up container verification resources
        if: always()
        run: |
          docker rm -f parkingpro-ci-api parkingpro-ci-operator parkingpro-ci-postgres parkingpro-ci-redis 2>/dev/null || true
          docker network rm parkingpro-ci 2>/dev/null || true

  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: verify
    environment: parkingpro-production
    concurrency:
      group: parkingpro-production-migrations
      cancel-in-progress: false
    env:
      APP_ENV: test
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DEMO_DRIVER_EMAIL: ${{ vars.PARKINGPRO_DEMO_DRIVER_EMAIL }}
      DEMO_DRIVER_PASSWORD: ${{ secrets.PARKINGPRO_DEMO_DRIVER_PASSWORD }}
      DEMO_OPERATOR_EMAIL: ${{ vars.PARKINGPRO_DEMO_OPERATOR_EMAIL }}
      DEMO_OPERATOR_PASSWORD: ${{ secrets.PARKINGPRO_DEMO_OPERATOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e backend
      - name: Apply additive production migrations
        working-directory: backend
        run: |
          python -m flask --app parkingpro.wsgi db upgrade
          python -m flask --app parkingpro.wsgi seed-demo

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [verify, containers, migrate]
    environment: parkingpro-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Trigger Render API deployment
        run: curl --fail --retry 3 --request POST "$RENDER_API_DEPLOY_HOOK"
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
      - name: Trigger Render web deployment
        run: curl --fail --retry 3 --request POST "$RENDER_WEB_DEPLOY_HOOK"
        env:
          RENDER_WEB_DEPLOY_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
      - name: Wait for deployment and run public smoke tests
        run: npm run smoke:deployment
        env:
          PARKINGPRO_API_URL: ${{ vars.PARKINGPRO_API_URL }}
          PARKINGPRO_WEB_URL: ${{ vars.PARKINGPRO_WEB_URL }}
          PARKINGPRO_DEMO_DRIVER_EMAIL: ${{ vars.PARKINGPRO_DEMO_DRIVER_EMAIL }}
          PARKINGPRO_DEMO_DRIVER_PASSWORD: ${{ secrets.PARKINGPRO_DEMO_DRIVER_PASSWORD }}
